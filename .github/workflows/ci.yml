name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  web:
    name: Angular console build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [dotnet, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t erp-mcp-gateway .
      - name: Smoke test the container
        run: |
          docker run -d -p 8080:8080 --name gw erp-mcp-gateway
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q "ERP MCP Gateway"
          curl -sf -X POST localhost:8080/mcp -H 'Content-Type: application/json' \
            -H 'Authorization: Bearer demo-viewer-token' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q list_invoices
